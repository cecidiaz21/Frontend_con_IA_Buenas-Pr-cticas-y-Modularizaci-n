<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Notas en el Navegador</title>

</head>
<body>
<div class ="w3-container w3-center w3-teal">
    <div class="contenedor">
        <h1>📝 Mis Notas</h1>

            <textarea id="nota" placeholder="Escribe una nota..."></textarea>

        </div>

        <ul id="listaNotas"></ul>
    </div>
</div>

    <script type="module" src="main.js"></script>
</body>
</html>
